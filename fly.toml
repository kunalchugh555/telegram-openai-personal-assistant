app = "my-telegram-assistant"
primary_region = "ord"

[build]

[env]
  DATA_DIR = "/data"

[[mounts]]
  source = "assistant_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[deploy]
  strategy = "immediate"

# No [[services]] block — this is a polling bot with no inbound HTTP
